# Fly.io config (alternative to Render). Deploy with:
#   fly launch --copy-config --no-deploy && fly deploy
# To bake in a tldraw license key:
#   fly deploy --build-arg VITE_TLDRAW_LICENSE_KEY=...
#
# One-time setup for durable usage stats (see "Usage stats" in the README):
#   fly volumes create stats_data --region arn --size 1
#   fly secrets set STATS_TOKEN=<pick-a-secret>
# The [mounts] section below attaches that volume at /data; the SQLite schema
# is created automatically on boot — no migrations or DB admin ever needed.
app = "tldraw-backgammon"
primary_region = "arn"

[build]

[env]
  PORT = "5858"
  STATS_DB_PATH = "/data/stats.sqlite"

[mounts]
  source = "stats_data"
  destination = "/data"

[http_service]
  internal_port = 5858
  force_https = true
  # In-memory rooms: an auto-stop kills live games, but for a POC the free
  # allowance matters more. Machines restart on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
